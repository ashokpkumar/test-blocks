<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Inside the frame</title>
  <style>
    body { margin: 0; padding: 12px; font-family: 'Fredoka', 'Segoe UI', system-ui, sans-serif; background: #F5EEFF; color: #2B2350; }
    input { font: inherit; padding: 6px 10px; border-radius: 10px; border: 2px solid #E4DEFA; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 7px 14px; color: #fff; background: #8B5CF6; cursor: pointer; }
    #frame-msg { font-weight: 600; color: #FF4FA3; margin-top: 8px; }
  </style>
</head>
<body>
  <div>I'm a page inside a page! 🪆</div>
  <p><input id="frame-input" placeholder="Type a color"> <button id="frame-btn">Paint</button></p>
  <div id="frame-msg"></div>
  <script>
    document.querySelector('#frame-btn').onclick = () => {
      const c = document.querySelector('#frame-input').value.trim() || 'purple';
      document.body.style.background = c;
      document.querySelector('#frame-msg').textContent = `Painted ${c}! 🎨`;
    };
  </script>
</body>
</html>
